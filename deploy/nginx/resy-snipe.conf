# resy-snipe nginx reverse proxy
#
# Install at: /etc/nginx/sites-available/resy-snipe.conf
# Enable:     ln -s ../sites-available/resy-snipe.conf /etc/nginx/sites-enabled/
#
# This is a production-style example. TLS is terminated here; the
# upstream daemon listens loopback-only on 127.0.0.1:7765 (the design
# default, see docs/v2/design/daemon.md §2.8). Change the upstream
# address+port here AND daemon.bind in /etc/resy-snipe/config.toml if
# you want to run on a different port.
#
# Reminder: the daemon's http.trusted_proxies CIDR list must include
# the IP nginx connects from. For nginx-on-same-host this is 127.0.0.1
# (already covered by the default loopback CIDR). For a remote proxy,
# add the proxy's source network to trusted_proxies in config.toml.

# ---- Upstream ------------------------------------------------------
upstream resy_snipe_daemon {
    server 127.0.0.1:7765;
    keepalive 16;
}

# ---- Optional rate-limit zones (commented; tune to your environment)
#
# limit_req_zone $binary_remote_addr zone=resy_auth:10m   rate=5r/m;
# limit_req_zone $binary_remote_addr zone=resy_quests:10m rate=30r/m;

# ---- HTTP -> HTTPS redirect ---------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name resy-snipe.example.com;

    # ACME http-01 challenge path (acme.sh / certbot webroot mode).
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acme/challenge;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS terminator ---------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name resy-snipe.example.com;

    # TLS certs. Two common provisioning paths:
    #   acme.sh: ssl_certificate     /etc/acme.sh/resy-snipe.example.com/fullchain.cer;
    #            ssl_certificate_key /etc/acme.sh/resy-snipe.example.com/resy-snipe.example.com.key;
    #   certbot: /etc/letsencrypt/live/resy-snipe.example.com/{fullchain,privkey}.pem
    ssl_certificate     /etc/letsencrypt/live/resy-snipe.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resy-snipe.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (the daemon ships no HTML, but proxies often add
    # these for defence in depth).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;

    # Sensible upload cap — Service-layer payloads are small JSON.
    client_max_body_size 1m;

    # ---- Proxy defaults -------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ---- Liveness / readiness ------------------------------------
    # /healthz is unauthenticated and cheap. Restrict to your management
    # network so it cannot be used to fingerprint the service.
    location = /healthz {
        allow 10.0.0.0/8;
        deny  all;
        access_log off;
        proxy_pass http://resy_snipe_daemon;
    }

    location = /readyz {
        allow 10.0.0.0/8;
        deny  all;
        access_log off;
        proxy_pass http://resy_snipe_daemon;
    }

    # /metrics and /debug/pprof should not be exposed publicly.
    # pprof is enforced loopback-only by the daemon (daemon.md §10), so
    # off-loopback requests get a 404 from the daemon itself. We block
    # at the proxy too as belt-and-braces.
    location = /metrics {
        allow 10.0.0.0/8;
        deny  all;
        proxy_pass http://resy_snipe_daemon;
    }

    location /debug/ {
        deny all;
        return 404;
    }

    # ---- SSE: /v1/quests/{id}/events ------------------------------
    # The daemon streams text/event-stream. nginx must not buffer, must
    # use HTTP/1.1, must clear Connection, and must hold the connection
    # open longer than the default 60s. (See daemon.md §4.5.)
    location ~ ^/v1/quests/[^/]+/events$ {
        # Optional per-route rate limit:
        # limit_req zone=resy_quests burst=10 nodelay;

        proxy_pass            http://resy_snipe_daemon;
        proxy_http_version    1.1;
        proxy_set_header      Connection "";
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    1h;
        proxy_send_timeout    1h;
        chunked_transfer_encoding off;
    }

    # ---- Auth endpoints (optional tight rate-limit) --------------
    location ^~ /v1/auth/ {
        # limit_req zone=resy_auth burst=3 nodelay;
        proxy_pass http://resy_snipe_daemon;
    }

    # ---- Quest endpoints (optional moderate rate-limit) ----------
    location ^~ /v1/quests {
        # limit_req zone=resy_quests burst=20 nodelay;
        proxy_pass http://resy_snipe_daemon;
    }

    # ---- Catch-all (Service API root) -----------------------------
    location / {
        proxy_pass http://resy_snipe_daemon;
    }
}
